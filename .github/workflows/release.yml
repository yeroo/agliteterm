name: Release

# Tag a commit (e.g. `git tag v0.17.5 && git push origin v0.17.5`) to build the installer and
# publish a GitHub Release with agliteterm-setup-<ver>.exe attached.
#
# The version lives in installer/agliteterm.iss and is compiled INTO the exe, which is what the
# self-updater compares against this feed — so the tag and that #define must agree, and the build
# fails loudly if they do not.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write        # for build-provenance attestation (free, keyless via Sigstore)
  attestations: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Check the tag against the compiled-in version
        # A release whose exe reports a different version than its tag breaks the updater in the
        # worst way: it downloads, installs, restarts, and still believes an update is available.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $iss = (Get-Content installer/agliteterm.iss -Raw)
          if ($iss -notmatch '#define\s+AppVersion\s+"([^"]+)"') { throw 'AppVersion not found in agliteterm.iss' }
          if ($Matches[1] -ne $tag) { throw "tag v$tag does not match agliteterm.iss AppVersion $($Matches[1])" }
          "version: $tag"

      - name: Build installer
        shell: pwsh
        run: ./installer/build.ps1

      # Free, certless supply-chain signing: a Sigstore-backed attestation binding the artifact to
      # this commit + workflow. Verify with:  gh attestation verify <file> --repo yeroo/agliteterm
      # (Doesn't remove SmartScreen — that needs Authenticode.)
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: installer/Output/agliteterm-setup-*.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/agliteterm-setup-*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
